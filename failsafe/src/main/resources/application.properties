# HIBERNATE FIX: Changed from 'create' to 'update'. 
# 'create' deletes all your data every time you restart the app! 'update' keeps your data safe.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# Aiven Kafka Configuration 
# ==========================================
# I updated this to your NEW Aiven URI and port
spring.kafka.bootstrap-servers=kafka-76af1e6-kafka-spring-failsafe.j.aivencloud.com:13246

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=failsafe-group-v4
spring.kafka.consumer.auto-offset-reset=earliest

# Authentication Setup
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="${KAFKA_PASSWORD}";

# Tell Kafka to use the Aiven CA Certificate you downloaded
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=classpath:ca.pem

spring.kafka.producer.acks=all
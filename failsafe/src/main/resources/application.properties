# ==========================================
# AWS RDS MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://failsafe-db.cfo8gkkmk7y0.eu-north-1.rds.amazonaws.com:3306/failsafe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=Sak133147

# Hibernate settings (keeps your existing schema creation behavior)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Kafka Configuration (Keeping it local or pointing to cloud if needed)
# ==========================================
spring.kafka.bootstrap-servers=failsafe-kafka-failsafev1.j.aivencloud.com:22404
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=failsafe-group
spring.kafka.consumer.auto-offset-reset=earliest

# Authentication Setup (SASL_SSL using SCRAM-SHA-512)
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:avnadmin}" password="${KAFKA_PASSWORD}";

# (Optional but recommended) Producer configuration for stability
spring.kafka.producer.acks=all